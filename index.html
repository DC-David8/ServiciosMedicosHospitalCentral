<body>
<!--APP-->
<div class="h-sirena" aria-hidden="true"></div>
<header class="h-cab">
  <div class="h-cab-in">
    <div class="h-cab-fila">
      <img class="h-logo" src="assets/logo-ems.png" alt="Logotipo EMS" width="52" height="52">
      <div class="h-titulo"><span>Hospital Central · EMS</span><h1>Centro de servicios</h1></div>
      <div class="h-turno">
        <span class="h-reloj" id="h-reloj" aria-label="Hora">--:--</span>
        <button type="button" class="h-btn-turno fuera" id="h-turno" aria-live="polite">Entrar de servicio</button>
      </div>
    </div>
  </div>
  <canvas class="h-ecg" id="h-ecg" height="44" aria-hidden="true"></canvas>
</header>

<main class="h-cuerpo">
  <div class="h-saludo">
    <h2 id="h-saludo">Hola</h2>
    <label class="h-buscar" for="h-buscar">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="h-buscar" type="search" autocomplete="off" placeholder="Buscar: parte, bala, embarazo, autopsia…" aria-describedby="h-buscar-info">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </div>
  <p class="h-buscar-info" id="h-buscar-info" aria-live="polite"></p>

  <div class="h-rejilla">
    <nav class="h-baldosas" id="h-baldosas" aria-label="Servicios"></nav>

    <aside class="h-lateral">
      <section class="h-panel" aria-labelledby="h-rec-tit">
        <h3 id="h-rec-tit">Recientes <button type="button" class="h-enlace" id="h-rec-borrar" hidden>Borrar</button></h3>
        <div id="h-recientes"></div>
      </section>

      <section class="h-panel h-ficha" aria-labelledby="h-ficha-tit">
        <h3 id="h-ficha-tit">Tu ficha <button type="button" class="h-enlace" id="h-ficha-editar">Editar</button></h3>
        <div id="h-ficha-ver"></div>
        <form id="h-ficha-form" class="h-ficha-form" hidden>
          <label for="hf-nombre">Nombre y apellidos</label>
          <input id="hf-nombre" autocomplete="off" placeholder="Dr. Nombre Apellido" required>
          <label for="hf-cargo">Cargo</label>
          <select id="hf-cargo"></select>
          <input id="hf-cargo-otro" autocomplete="off" placeholder="Escribe el cargo" aria-label="Cargo (escrito a mano)" hidden>
          <label for="hf-firma">Firma <small>(si la dejas vacía, se usa el nombre)</small></label>
          <input id="hf-firma" autocomplete="off" placeholder="Igual que el nombre">
          <div class="h-ficha-acc"><button type="submit" class="h-btn">Guardar</button><button type="button" class="h-btn h-btn-sec" id="hf-cancelar">Cancelar</button></div>
        </form>
        <p class="h-nota">Se usa en todos los documentos de este navegador.</p>
      </section>

      <section class="h-panel" aria-labelledby="h-cmd-tit">
        <h3 id="h-cmd-tit">Comandos /ems</h3>
        <div id="h-comandos"></div>
      </section>
    </aside>
  </div>
  <noscript><p class="aviso">Activa JavaScript para usar los servicios.</p></noscript>
</main>

<footer class="pie">Hospital Central · Uso exclusivo de rol · <a href="admin.html">Acceso evaluadores</a></footer>
<!--/APP-->

<script src="js/hospital.js"></script>
<script src="js/servicios.js"></script>
<script src="js/protocolos.js"></script>
<script src="js/recientes.js"></script>
<script src="js/home.js"></script>
</body>
</html>
