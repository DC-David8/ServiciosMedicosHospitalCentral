<body>
<!--APP-->
<header class="cabecera">
  <div class="cabecera-in">
    <img class="cabecera-logo" src="assets/logo-ems.png" alt="Logotipo EMS" width="56" height="56">
    <div class="cabecera-txt">
      <span class="cabecera-org">Hospital Central · EMS</span>
      <h1>Servicios médicos</h1>
    </div>
  </div>
</header>

<main class="contenedor portal">
  <p class="portal-intro">Elige el servicio que vas a realizar. Cada uno genera su documento oficial del Hospital Central en PNG o PDF.</p>
  <div id="areas" class="areas"></div>
  <noscript><p class="aviso">Activa JavaScript para usar los servicios.</p></noscript>
</main>

<footer class="pie">Hospital Central · Uso exclusivo de rol · <a href="admin.html">Acceso evaluadores</a></footer>
<!--/APP-->

<script src="js/servicios.js"></script>
<script>
(() => {
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("areas").innerHTML = AREAS.map((a) => {
    const lista = SERVICIOS_HOSPITAL.filter((s) => s.area === a.id);
    if (!lista.length) return "";
    return `<section class="area">
      <h2 class="area-titulo">${esc(a.nombre)}</h2>
      <div class="servicios">${lista.map((s) => {
        const activo = s.estado === "activo";
        const interior = `
          <img class="servicio-icono" src="${esc(s.icono)}" alt="" width="64" height="64">
          <span class="servicio-txt">
            <span class="servicio-nombre">${esc(s.nombre)}</span>
            <span class="servicio-desc">${esc(s.desc)}</span>
            <span class="servicio-pie">
              <span class="servicio-doc">${esc(s.documento)}</span>
              ${activo ? `<span class="servicio-ir">Abrir →</span>` : `<span class="servicio-pronto">Próximamente</span>`}
            </span>
          </span>`;
        return activo
          ? `<a class="servicio" href="${esc(s.href)}">${interior}</a>`
          : `<div class="servicio es-pronto" aria-disabled="true">${interior}</div>`;
      }).join("")}</div>
    </section>`;
  }).join("");
})();
</script>
</body>
